<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Buen día, maestra Vany! 🍎</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#7dd3fc 0%,#fde68a 55%,#fdba74 80%,#fb7185 100%);
  background-size:100% 160%;animation:amanecer 16s ease-in-out infinite alternate}
@keyframes amanecer{from{background-position:0 100%}to{background-position:0 0}}
.sol{position:fixed;left:50%;bottom:-130px;width:260px;height:260px;margin-left:-130px;border-radius:50%;
  background:radial-gradient(circle,#fffbeb 0%,#fde047 45%,#fb923c 100%);
  box-shadow:0 0 80px 30px rgba(253,224,71,.7);animation:sube 5s ease-out forwards,late 3s ease-in-out 5s infinite alternate;z-index:1}
.sol::before{content:"";position:absolute;inset:-90px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.35) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);
  animation:gira 40s linear infinite}
@keyframes sube{to{bottom:22vh}}
@keyframes late{to{transform:scale(1.07)}}
@keyframes gira{to{transform:rotate(360deg)}}
.cielo{position:fixed;inset:0;z-index:0;pointer-events:none}
.nube{position:absolute;font-size:4rem;opacity:.85;animation:deriva linear infinite}
@keyframes deriva{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.flota{position:fixed;bottom:-60px;z-index:3;pointer-events:none;will-change:transform}
.escena{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 90px;text-align:center}
.pizarra{width:min(560px,92vw);padding:14px;border-radius:22px;background:linear-gradient(135deg,#a16207,#78350f);
  box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.15);
  opacity:0;transform:translateY(30px) scale(.92);animation:entra 1.1s cubic-bezier(.2,1.4,.4,1) 1.2s forwards}
@keyframes entra{to{opacity:1;transform:none}}
.tabla{border-radius:12px;padding:30px 20px 26px;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;
  background:radial-gradient(ellipse at 30% 20%,#2f6f55,#1f4d3b 70%);box-shadow:inset 0 0 30px rgba(0,0,0,.5);color:#f8fafc}
#titulo{font-family:'Pacifico',cursive;font-size:clamp(2rem,8vw,3.4rem);line-height:1.2;color:#fff;
  text-shadow:0 0 14px rgba(255,255,255,.5);margin:0}
#titulo b{color:#fde047;font-weight:400}
#sub{font-size:clamp(1.05rem,4.2vw,1.45rem);font-weight:600;min-height:3.2em;color:#fef3c7;opacity:0;transition:opacity .6s,transform .6s;transform:translateY(8px);
  display:flex;align-items:center;justify-content:center}
#sub.on{opacity:1;transform:none}
.tiza{width:60%;height:3px;border-radius:3px;background:rgba(255,255,255,.55)}
.cursor::after{content:"|";margin-left:2px;animation:parp .7s steps(1) infinite}
@keyframes parp{50%{opacity:0}}
.ninos{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:clamp(6px,2.5vw,22px);
  padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));font-size:clamp(2.6rem,10vw,4.2rem);pointer-events:none}
.ninos span{display:inline-block;transform-origin:bottom center;animation:salta 1.3s ease-in-out infinite}
.ninos span:nth-child(2n){animation-delay:.25s}.ninos span:nth-child(3n){animation-delay:.5s}
@keyframes salta{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(6deg)}}
.pasto{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:4;background:linear-gradient(#4ade80,#16a34a);border-radius:50% 50% 0 0/30px 30px 0 0}
.pista{position:fixed;bottom:84px;left:0;right:0;text-align:center;z-index:7;color:#fff;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.5);opacity:.8;pointer-events:none}
</style>
</head>
<body>
<div class="cielo" id="cielo"></div>
<div class="sol"></div>

<main class="escena">
  <div class="pizarra">
    <div class="tabla">
      <h1 id="titulo" class="cursor"></h1>
      <div class="tiza"></div>
      <div id="sub"></div>
    </div>
  </div>
</main>

<div class="pasto"></div>
<div class="ninos"><span>🧒</span><span>👧</span><span>👦</span><span>🍎</span><span>👧🏽</span><span>🧒🏻</span><span>👦🏽</span></div>
<div class="pista">toca la pantalla ✨</div>

<script>
/* Nubes */
const cielo=document.getElementById('cielo');
for(let i=0;i<5;i++){const n=document.createElement('div');n.className='nube';n.textContent='☁️';
  n.style.top=(4+Math.random()*30)+'vh';n.style.fontSize=(3+Math.random()*3)+'rem';
  n.style.animationDuration=(50+Math.random()*50)+'s';n.style.animationDelay=(-Math.random()*60)+'s';cielo.appendChild(n)}

/* Objetos que flotan hacia arriba */
const COSAS=['✏️','📚','🍎','⭐','🌈','💛','🎒','📖','🖍️','✨','🌟','🎨','🔤','💫'];
function flota(){
  const e=document.createElement('div');e.className='flota';
  e.textContent=COSAS[Math.floor(Math.random()*COSAS.length)];
  const s=1.4+Math.random()*1.8;e.style.fontSize=s+'rem';e.style.left=(Math.random()*96)+'vw';
  document.body.appendChild(e);
  const dur=8000+Math.random()*6000,x=(Math.random()-.5)*120,r=(Math.random()-.5)*60;
  const a=e.animate([{transform:'translate(0,0) rotate(0)',opacity:0},{opacity:1,offset:.1},
    {transform:`translate(${x}px,-55vh) rotate(${r}deg)`,opacity:1,offset:.6},
    {transform:`translate(${-x}px,-115vh) rotate(${-r}deg)`,opacity:0}],{duration:dur,easing:'ease-in-out'});
  a.onfinish=()=>e.remove();
}
setInterval(flota,650);for(let i=0;i<6;i++)setTimeout(flota,i*200);

/* Explosión al tocar */
const BURST=['💛','⭐','✨','🍎','🌸','💖','🌟'];
function burst(x,y){
  for(let i=0;i<16;i++){
    const e=document.createElement('div');e.className='flota';e.style.bottom='auto';e.style.zIndex=9;
    e.textContent=BURST[Math.floor(Math.random()*BURST.length)];e.style.fontSize=(1.2+Math.random()*1.4)+'rem';
    e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
    const ang=Math.random()*Math.PI*2,d=70+Math.random()*130;
    e.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*d}px),calc(-50% + ${Math.sin(ang)*d-40}px)) scale(1.1)`,opacity:1,offset:.6},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*d*1.2}px),calc(-50% + ${Math.sin(ang)*d+60}px)) scale(.8)`,opacity:0}],
      {duration:1300,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>e.remove();
  }
}
addEventListener('pointerdown',ev=>burst(ev.clientX,ev.clientY));

/* Texto estilo pizarra */
const titulo=document.getElementById('titulo'),sub=document.getElementById('sub');
const T1='¡Buen día, maestra Vany!';
function escribir(){let i=0;(function paso(){
  const t=T1.slice(0,++i);titulo.innerHTML=t.replace('Vany','<b>Vany</b>');
  if(i<T1.length)setTimeout(paso,85);else{titulo.classList.remove('cursor');ciclo()}})()}
const MSG=['Hoy es un día hermoso, como tú 🌸','Que tus niños te llenen de sonrisas 😊','Tu paciencia y tu cariño dejan huella 💛',
  '¡Mucho éxito con tus niños! 🍎','Eres la mejor maestra para ellos 🌟','¡Que tengas un día increíble, Vany! 🌈'];
let m=0;
function ciclo(){sub.classList.remove('on');setTimeout(()=>{sub.textContent=MSG[m++%MSG.length];sub.classList.add('on')},500);setTimeout(ciclo,4200)}
setTimeout(escribir,2300);
setTimeout(()=>burst(innerWidth/2,innerHeight*.4),2000);
</script>
</body>
</html>
